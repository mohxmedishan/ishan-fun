<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ishan.fun | Hub</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Inline Styles for Achievements Grid & Cards */
    .hub-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .points-banner {
      background: rgba(24, 24, 27, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    .point-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .point-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .point-val {
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
    }

    .point-val.hc {
      color: #ff5e00;
    }

    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .progress-tag {
      font-size: 0.85rem;
      color: #a1a1aa;
      font-weight: 700;
    }

    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .achievement-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .achievement-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .achievement-card.hard-tier-card {
      background: rgba(255, 94, 0, 0.04);
      border-color: rgba(255, 94, 0, 0.15);
    }

    .achievement-card.unlocked {
      border-color: rgba(74, 222, 128, 0.4);
    }

    .achievement-card.hard-tier-card.unlocked {
      border-color: rgba(255, 94, 0, 0.5);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: #ffffff;
    }

    .pts-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
    }

    .hc-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 94, 0, 0.15);
      color: #ff5e00;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #a1a1aa;
      line-height: 1.4;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: auto;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .badge-locked {
      background: rgba(255, 255, 255, 0.08);
      color: #71717a;
    }

    .badge-completed {
      background: #4ade80;
      color: #000000;
    }

    .hard-tier-card .badge-completed {
      background: #ff5e00;
      color: #ffffff;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .game-card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">Ishan.fun</a>
    <div class="nav-actions">
      <a href="button-clicker/index.html" class="nav-btn">Play Games</a>
    </div>
  </nav>

  <main class="hub-container">
    <!-- Total Points Overview -->
    <div class="points-banner">
      <div class="point-box">
        <span class="point-label">Total PTS</span>
        <span id="total-pts" class="point-val">0</span>
      </div>
      <div class="point-box">
        <span class="point-label">Hardcore Points</span>
        <span id="total-hc-pts" class="point-val hc">0</span>
      </div>
    </div>

    <!-- Games Section -->
    <section>
      <div class="section-title-row">
        <h2 class="section-title">Games</h2>
      </div>
      <div class="games-grid">
        <a href="button-clicker/index.html" class="game-card">
          <span style="font-weight: 800; font-size: 1.2rem;">Button Clicker</span>
          <span style="font-size: 0.85rem; color: #a1a1aa;">Click to gain points, unlock Rebirths, or survive Hardcore Mode.</span>
        </a>
      </div>
    </section>

    <!-- Achievements Section -->
    <section>
      <div class="section-title-row">
        <h2 class="section-title">Achievements</h2>
        <span id="ach-progress-count" class="progress-tag">0 / 2 Completed</span>
      </div>
      <div id="achievements-grid" class="achievements-grid">
        <!-- Rendered dynamically by script below -->
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC5c-np0wNIMkcowH4Rr1i5r3B2-qGY1e4",
      authDomain: "ishan-fun.firebaseapp.com",
      projectId: "ishan-fun",
      storageBucket: "ishan-fun.firebasestorage.app",
      messagingSenderId: "919307010777",
      appId: "1:919307010777:web:35b659050c32e7c05c74c8",
      measurementId: "G-S8H37T0FNX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ACHIEVEMENTS_LIST = [
      {
        id: "ach_button_smasher",
        title: "Button Smasher!",
        description: "Reach 1,000 clicks in a single un-rebirthed run.",
        points: 10,
        hcPoints: 0,
        isHardTier: false
      },
      {
        id: "ach_hardcore_player",
        title: "Hardcore Player",
        description: "Beat any game in Hardcore Mode.",
        points: 0,
        hcPoints: 5,
        isHardTier: true
      }
    ];

    const totalPtsEl = document.getElementById("total-pts");
    const totalHcPtsEl = document.getElementById("total-hc-pts");
    const gridContainer = document.getElementById("achievements-grid");

    function renderAchievements() {
      if (!gridContainer) return;
      gridContainer.innerHTML = "";

      let unlockedCount = 0;

      ACHIEVEMENTS_LIST.forEach((ach) => {
        const isUnlocked = localStorage.getItem(ach.id) === "true";
        if (isUnlocked) unlockedCount++;

        const card = document.createElement("div");
        card.className = `achievement-card ${ach.isHardTier ? "hard-tier-card" : ""} ${isUnlocked ? "unlocked" : "locked"}`;

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${ach.title}</span>
            <span class="reward-tag ${ach.isHardTier ? "hc-tag" : "pts-tag"}">
              +${ach.isHardTier ? `${ach.hcPoints} HCP` : `${ach.points} PTS`}
            </span>
          </div>
          <p class="card-desc">${ach.description}</p>
          <div class="card-footer">
            <span class="status-badge ${isUnlocked ? "badge-completed" : "badge-locked"}">
              ${isUnlocked ? "COMPLETED" : "LOCKED"}
            </span>
          </div>
        `;

        gridContainer.appendChild(card);
      });

      const progressCountEl = document.getElementById("ach-progress-count");
      if (progressCountEl) {
        progressCountEl.textContent = `${unlockedCount} / ${ACHIEVEMENTS_LIST.length} Completed`;
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const userRef = doc(db, "users", user.uid);
        onSnapshot(userRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (totalPtsEl) totalPtsEl.textContent = (data.points || 0).toLocaleString();
            if (totalHcPtsEl) totalHcPtsEl.textContent = (data.hcPoints || 0).toLocaleString();
          }
        });
      } else {
        if (totalPtsEl) totalPtsEl.textContent = "0";
        if (totalHcPtsEl) totalHcPtsEl.textContent = "0";
      }
      renderAchievements();
    });

    renderAchievements();
  </script>
</body>
</html>
