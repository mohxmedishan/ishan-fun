<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Clicker - Ishan.fun</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navbar matching Ishan.fun UI -->
  <nav class="navbar">
    <a href="../index.html" class="logo">Ishan.fun</a>
    <div class="nav-actions">
      <a href="../index.html" class="nav-btn">← Back to Home</a>
    </div>
  </nav>

  <!-- Main Counter Screen -->
  <div id="main-screen" class="screen-container">

    <div id="game-card">
      <h1>Button Counter</h1>
      <p>Count: <span id="count">0</span></p>

      <!-- Click Button -->
      <button id="increment-btn">Click Me</button>

      <!-- Action Slot -->
      <div id="action-slot">
        <!-- Progress Bar -->
        <div id="progress-container">
          <div id="progress-fill"></div>
          <span id="progress-text">0%</span>
        </div>

        <!-- Rebirth Button -->
        <button id="rebirth-btn">
          Rebirth (2x Power)
        </button>
      </div>
    </div>

    <!-- Game Over Modal Overlay -->
    <div id="game-over-overlay">
      <div id="game-over-box">
        <h2 id="game-over-title">GAME OVER!</h2>
        <div id="game-over-stats">
          <p>Total Score: <span id="total-clicks">0</span></p>
        </div>
      </div>
      <button id="restart-btn">Restart</button>
    </div>

  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
