<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Button Clicker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main id="main-screen">
    <div id="game-card" class="game-card">
      
      <div id="mode-badge" class="mode-badge">Normal</div>

      <div class="counter-container">
        <h1 id="count">0</h1>
      </div>

      <div class="action-area">
        <button id="increment-btn" class="game-btn">CLICK ME</button>
        <button id="rebirth-btn" class="rebirth-btn">Rebirth to 1 (2 per click)</button>
      </div>

      <div id="progress-container" class="progress-container hide-progress">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text">0%</span>
      </div>

    </div>
  </main>

  <!-- Mode Selection Modal -->
  <div id="mode-overlay" class="modal-overlay show-modal">
    <div class="modal-box">
      <h2>Select Mode</h2>
      <p>Choose your difficulty to begin:</p>

      <div class="mode-btns">
        <button id="normal-mode-btn" class="mode-choice-btn">
          <strong>Normal Mode</strong>
          <span>Earn +5 Points</span>
        </button>

        <button id="hardcore-mode-btn" class="mode-choice-btn hardcore">
          <strong>Hardcore Mode 🔥</strong>
          <span>Earn +10 Points</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="game-over-overlay" class="modal-overlay">
    <div class="modal-box">
      <h2>🎉 Game Complete!</h2>
      <p>You beat <span id="summary-mode">Normal</span> mode!</p>

      <div class="reward-box">
        <span id="earned-points">+5 Points!</span>
      </div>

      <button id="restart-btn" class="restart-btn">Play Again</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
