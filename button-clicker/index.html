<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Button Clicker | Ishan.fun</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating Toast Container -->
  <div id="achievement-toast-container"></div>

  <nav class="navbar">
    <a href="../index.html" class="logo">Ishan.fun</a>
    <div class="nav-actions">
      <a href="../index.html" class="nav-btn">← Back to Hub</a>
    </div>
  </nav>

  <main class="game-container">
    <div class="game-box">
      <h1>Button Clicker</h1>
      <p class="game-sub">Click to gain points and reach Rebirths!</p>

      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-label">Clicks</span>
          <span id="click-count" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Rebirths</span>
          <span id="rebirth-count" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Hardcore Clicks</span>
          <span id="hardcore-count" class="stat-value">0</span>
        </div>
      </div>

      <button id="main-click-btn" class="click-btn">CLICK ME!</button>
      <button id="hardcore-click-btn" class="click-btn hardcore-btn">HARDCORE CLICK</button>
      <button id="rebirth-btn" class="rebirth-btn">Rebirth (Requires 1,000 Clicks)</button>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
